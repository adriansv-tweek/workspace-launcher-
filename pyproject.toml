[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-launcher"
version = "0.1.0"
description = "Local Windows application for saving and restoring a desktop workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
workspace-launcher = "workspace_launcher.app:main"

[tool.setuptools.packages.find]
include = ["workspace_launcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
